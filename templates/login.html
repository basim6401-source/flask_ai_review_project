<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restricted Access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(127,90,240,0.4), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34,197,94,0.22), transparent 28%),
        linear-gradient(135deg, #0f172a, #111827 42%, #1f2937);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      padding: 24px;
    }
    .card {
      width: min(92vw, 440px);
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 30px 26px 24px;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.45);
    }
    h2 {
      margin: 0 0 18px;
      text-align: left;
      font-size: 2rem;
      font-weight: 700;
    }
    .subtitle {
      margin: 0 0 22px;
      color: rgba(226, 232, 240, 0.8);
      font-size: 0.97rem;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      color: white;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      border-color: rgba(167, 139, 250, 0.9);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      padding: 13px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(99, 102, 241, 0.4);
    }
    .error {
      background: rgba(239, 68, 68, 0.12);
      color: #fecaca;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 0.92rem;
    }
    .links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .link {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.94rem;
    }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Restricted Access</h2>
    <p class="subtitle">Secure sign in for authorized management.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Enter username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter password" required />

      <button type="submit">Login</button>
    </form>

    <div class="links" style="justify-content:center;">
      <span class="link" style="opacity:0.7;">Authorized users only</span>
    </div>
  </div>
</body>
</html>
